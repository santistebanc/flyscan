# Required PR checks. Linux only; Windows builds stay in the release workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: pre-commit (desktop typecheck runs in the desktop job)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: desktop-typecheck

  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run pytest -q

  desktop:
    name: desktop tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  web:
    name: web container (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [public, private]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and probe the container without scraping
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          docker build --build-arg "FLYSCAN_EDITION=$EDITION" --tag "flyscan:$EDITION" .
          password_hash="$(docker run --rm --entrypoint python "flyscan:$EDITION" -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('ci-only-password'))")"
          docker run --detach --name flyscan-smoke -e FLYSCAN_SESSION_SECRET=ci-only-session -e "FLYSCAN_PRIVATE_PASSWORD_HASH=$password_hash" "flyscan:$EDITION"
          trap 'docker rm -f flyscan-smoke' EXIT
          docker exec -i flyscan-smoke python - "$EDITION" < packaging/smoke_web.py
