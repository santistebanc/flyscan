name: Publish Windows release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and source branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Run this workflow against a stable version tag.' }
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'The tag must match the app version.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to commits on main.' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build, test and sign updater assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
        run: ./packaging/build-windows.ps1 -Python (Get-Command python).Source -UpdaterRelease -ReleaseRepository $env:RELEASES_REPOSITORY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flight-Scraper-Windows-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified assets to the downloads repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
        run: ./packaging/publish-windows-release.ps1 -Repository $env:RELEASES_REPOSITORY
