# Rust/Tauri compile check, only when the shell's Rust side changes. Not a required check,
# because it doesn't run on every PR.
name: CI (Tauri)

on:
  pull_request:
    paths: ["desktop/src-tauri/**"]

concurrency:
  group: ci-tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Placeholders tauri-build expects (web build + Python sidecar)
        run: |
          mkdir -p desktop/dist desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/flyscan-sidecar-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo check --locked
        working-directory: desktop/src-tauri
