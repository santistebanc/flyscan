name: Release

# One trigger for a release: bump every version, write the notes, commit and tag on main,
# then build, sign and publish the desktop app for Windows and Linux (x64 and ARM64) and
# macOS (Apple Silicon and Intel), and the web release, in this repository, and deploy the
# web release to flyscan.site. Start it from the Actions tab, the GitHub app, or `gh workflow run release`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (major.minor.patch). Empty releases the next patch."
        required: false
      notes:
        description: "What changed, shown in the update prompt. Empty lists the commits since the last release."
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require all release destinations before creating a tag
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_ID }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in RAILWAY_TOKEN RAILWAY_SERVICE SIGNING_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing release setting: $name"; exit 1; fi
          done

  tag:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Bump the version, write the notes, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          current="$(jq -r .version desktop/package.json)"
          version="${VERSION:-}"
          if [ -z "$version" ]; then
            IFS=. read -r major minor patch <<<"$current"
            version="$major.$minor.$((patch + 1))"
          fi
          # Installed apps only update to a higher version.
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ] || [ "$version" = "$current" ]; then
            echo "::error::$version is not newer than $current"; exit 1
          fi
          last="$(git log -G'"version":' --format=%H -1 -- desktop/src-tauri/tauri.conf.json)"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > packaging/release-notes.md
          else
            git log --no-merges --format='- %s' "$last"..HEAD > packaging/release-notes.md
          fi
          node packaging/set-version.mjs "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$version"
          git tag "v$version"
          git push origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: tag
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Rust stable
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:RUNNER_ARCH -eq "ARM64") { "aarch64" } else { "x86_64" }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile "$env:RUNNER_TEMP/rustup-init.exe"
            & "$env:RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none
            "$env:USERPROFILE/.cargo/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE/.cargo/bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build, test and sign updater assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ./packaging/build-windows.ps1 -Python (Get-Command python).Source -Architecture ${{ matrix.arch }} -UpdaterRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flyscan-windows-${{ matrix.arch }}-${{ needs.tag.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  unix:
    needs: tag
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          # The oldest supported Ubuntu sets the oldest glibc the app runs on.
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build, test and sign updater assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Optional Developer ID signing and notarization; without them the app is signed ad hoc.
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri treats a set but empty variable as configured, so pass on only real values.
          if [ "$RUNNER_OS" = macOS ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              secret="SECRET_$name"
              if [ -n "${!secret}" ]; then export "$name=${!secret}"; fi
            done
          fi
          packaging/build-unix.sh --python "$(command -v python)" --updater-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flyscan-${{ matrix.platform }}-${{ needs.tag.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  web:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build and check the deployable image
        run: |
          docker build --tag flyscan .
          docker run --detach --name flyscan-smoke flyscan
          trap 'docker rm -f flyscan-smoke' EXIT
          docker exec flyscan-smoke node /app/packaging/smoke_web.mjs
          mkdir -p release
          tar --exclude='desktop/node_modules' --exclude='desktop/dist' --exclude='desktop/src-tauri' --exclude='backend/node_modules' --exclude='backend/dist' --exclude='flyscan/__pycache__' -czf release/flyscan-web.tar.gz Dockerfile .dockerignore railway.json package.json pyproject.toml uv.lock README.md packaging/requirements-web.lock packaging/smoke_web.mjs flyscan backend shared desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flyscan-Web-${{ needs.tag.outputs.tag }}
          path: release/flyscan-web.tar.gz
          if-no-files-found: error

  publish:
    needs: [tag, windows, unix, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: Flyscan-*-${{ needs.tag.outputs.tag }}
          path: release
          merge-multiple: true
      - name: Check every platform's build and write the update manifest
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: node packaging/create-update-manifest.mjs --version "${RELEASE_TAG#v}" --repository "$REPOSITORY" --notes packaging/release-notes.md
      - name: Publish the complete, verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: ./packaging/publish-release.ps1 -Repository $env:REPOSITORY

  deploy:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Deploy this exact release to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_ID }}
        run: npx --yes @railway/cli@4 up --ci --service "$RAILWAY_SERVICE"
