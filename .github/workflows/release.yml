name: Release

# One trigger for a release: bump every version, write the notes, commit and tag on main,
# then build, sign and publish public/private Windows and web editions, and deploy
# both web services. Start it from the Actions tab, the GitHub app, or `gh workflow run release`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (major.minor.patch). Empty releases the next patch."
        required: false
      notes:
        description: "What changed, shown in the update prompt. Empty lists the commits since the last release."
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require all release destinations before creating a tag
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_PRIVATE_SERVICE: ${{ vars.RAILWAY_PRIVATE_SERVICE_ID }}
          PRIVATE_UPDATE_ORIGIN: ${{ vars.PRIVATE_UPDATE_ORIGIN }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in RAILWAY_TOKEN RAILWAY_SERVICE RAILWAY_PRIVATE_SERVICE PRIVATE_UPDATE_ORIGIN RELEASES_REPOSITORY RELEASES_TOKEN SIGNING_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing release setting: $name"; exit 1; fi
          done
          case "$PRIVATE_UPDATE_ORIGIN" in https://*) ;; *) echo "::error::Private updates require HTTPS"; exit 1;; esac
          if [ "$RELEASES_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then echo "::error::Public/private release repositories must differ"; exit 1; fi

  tag:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Bump the version, write the notes, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          current="$(jq -r .version desktop/package.json)"
          version="${VERSION:-}"
          if [ -z "$version" ]; then
            IFS=. read -r major minor patch <<<"$current"
            version="$major.$minor.$((patch + 1))"
          fi
          # Installed apps only update to a higher version.
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ] || [ "$version" = "$current" ]; then
            echo "::error::$version is not newer than $current"; exit 1
          fi
          last="$(git log -G'"version":' --format=%H -1 -- desktop/src-tauri/tauri.conf.json)"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > packaging/release-notes.md
          else
            git log --no-merges --format='- %s' "$last"..HEAD > packaging/release-notes.md
          fi
          python3 packaging/set-version.py "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$version"
          git tag "v$version"
          git push origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [public, private]
    permissions:
      contents: write
    env:
      RELEASE_EDITION: ${{ matrix.edition }}
      PRIVATE_UPDATE_ORIGIN: ${{ vars.PRIVATE_UPDATE_ORIGIN }}
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build, test and sign updater assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          RELEASES_REPOSITORY: ${{ matrix.edition == 'private' && github.repository || vars.RELEASES_REPOSITORY }}
        run: ./packaging/build-windows.ps1 -Edition $env:RELEASE_EDITION -UpdateOrigin $env:PRIVATE_UPDATE_ORIGIN -Python (Get-Command python).Source -UpdaterRelease -ReleaseRepository $env:RELEASES_REPOSITORY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flyscan-${{ matrix.edition }}-Windows-${{ needs.tag.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  web:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        edition: [public, private]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Prepare the edition and build the deployable image
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          # The private archive defaults to private; the public archive defaults to public.
          sed -i "s/ARG FLYSCAN_EDITION=public/ARG FLYSCAN_EDITION=$EDITION/" Dockerfile
          docker build --tag "flyscan:$EDITION" .
          password_hash="$(docker run --rm --entrypoint python "flyscan:$EDITION" -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('ci-only-password'))")"
          docker run --detach --name flyscan-smoke -e FLYSCAN_SESSION_SECRET=ci-only-session -e "FLYSCAN_PRIVATE_PASSWORD_HASH=$password_hash" "flyscan:$EDITION"
          trap 'docker rm -f flyscan-smoke' EXIT
          docker exec -i flyscan-smoke python - "$EDITION" < packaging/smoke_web.py
          mkdir -p release
          tar --exclude='desktop/node_modules' --exclude='desktop/dist' --exclude='desktop/src-tauri' --exclude='flyscan/__pycache__' --exclude='flyscan/_build.py' -czf "release/flyscan-$EDITION-web.tar.gz" Dockerfile .dockerignore railway.json pyproject.toml README.md packaging/requirements-web.lock flyscan desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flyscan-${{ matrix.edition }}-Web-${{ needs.tag.outputs.tag }}
          path: release/flyscan-${{ matrix.edition }}-web.tar.gz
          if-no-files-found: error

  publish:
    needs: [tag, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        edition: [public, private]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: Flyscan-${{ matrix.edition }}-*-${{ needs.tag.outputs.tag }}
          path: release
          merge-multiple: true
      - name: Publish complete, verified edition
        shell: pwsh
        env:
          GH_TOKEN: ${{ matrix.edition == 'private' && github.token || secrets.RELEASES_TOKEN }}
          REPOSITORY: ${{ matrix.edition == 'private' && github.repository || vars.RELEASES_REPOSITORY }}
          RELEASE_EDITION: ${{ matrix.edition }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: ./packaging/publish-windows-release.ps1 -Edition $env:RELEASE_EDITION -Repository $env:REPOSITORY

  deploy:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [public, private]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Deploy this exact release to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ matrix.edition == 'private' && vars.RAILWAY_PRIVATE_SERVICE_ID || vars.RAILWAY_SERVICE_ID }}
          EDITION: ${{ matrix.edition }}
        run: |
          sed -i "s/ARG FLYSCAN_EDITION=public/ARG FLYSCAN_EDITION=$EDITION/" Dockerfile
          npx --yes @railway/cli@4 up --ci --service "$RAILWAY_SERVICE"
