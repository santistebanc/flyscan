[package]
name = "flyscan-desktop"
version = "0.4.2"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
# Only for the sleep in the challenge poll loop.
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2.14.0"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
