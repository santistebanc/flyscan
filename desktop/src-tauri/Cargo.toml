[package]
name = "flight-scraper-desktop"
version = "0.3.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the sleep in the challenge poll loop.
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
