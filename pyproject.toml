[project]
name = "flyscan"
version = "0.3.9"
description = "Scrape flight prices from six metasearch sources in parallel and compare them in one currency."
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "lxml>=5.0",
    "cssselect>=1.2",
    "flask>=3.0",
    "waitress>=3.0.2,<4",
]

[project.scripts]
flyscan = "flyscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flyscan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, import sorting and bugbear. pyupgrade (UP) is left off on purpose:
# it would rewrite ~400 annotations for no behaviour change.
select = ["E4", "E7", "E9", "F", "I", "B"]


[dependency-groups]
dev = ["pytest", "ruff==0.17.1", "pre-commit", "playwright==1.64.0"]
