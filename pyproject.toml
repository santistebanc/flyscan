[project]
name = "flyscan"
version = "0.4.3"
description = "Flyscan curl_cffi transport dependencies."
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]


[dependency-groups]
dev = ["ruff==0.17.1", "pre-commit"]
