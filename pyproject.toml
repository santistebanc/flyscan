[project]
name = "flight-scraper"
version = "0.3.4"
description = "Scrape flight prices from six metasearch sources in parallel and compare them in one currency."
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "lxml>=5.0",
    "cssselect>=1.2",
    "flask>=3.0",
    "waitress>=3.0.2,<4",
]

[project.scripts]
flight-scraper = "flight_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flight_scraper"]
