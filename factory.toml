# How the software factory treats this repo. Global settings: santistebanc/factory config/factory.toml.

[commands]
setup = "uv sync && uv run pre-commit install && (cd desktop && npm ci)"
check = "uv run pre-commit run --all-files"
test = "uv run pytest -q && (cd desktop && npm test && npm run build)"

[paths]
ui = ["desktop/src/**"]                 # a PR touching these needs the owner's visual check
heavy = ["desktop/src-tauri/**"]        # Rust/Tauri: build in CI, not on the Beelink

[rules]
live_network = false                    # a brief can allow it per ticket (sets FACTORY_ALLOW_LIVE=1)

[protection]
# Applied to the default branch by santistebanc/factory scripts/protect-branch.
required_checks = ["checks (pre-commit)", "python tests", "desktop tests + build"]
required_approvals = 1
